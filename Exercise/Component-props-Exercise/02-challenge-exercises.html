<!DOCTYPE html>
<html>
  <head>
    <title>Exercise: Component and Props</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="01-react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js">
    </script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const container = document.querySelector('.js-container');

      // Exercise 2e-f-e-g-h
      function ProductDetails({productName, price, discountPrice, imageSrc}){

        return (
          <>
            {discountPrice ? 
              (
                <>
                  <img src={imageSrc} width="50"/>
                  <p>{productName}</p>
                  <del>Price: {price}</del>
                  <p>Discount price: {discountPrice}</p>
                  <button>Add to Cart</button>
                </>
              )
              : 
              (
                <div>
                  <img src={imageSrc} width="50"/>
                  <p>{productName}</p>
                  <p>Price: {price}</p>
                  <button>Add to Cart</button>
                </div>
              )
            }
          </>
        );
      }

      function App(){
        return (
          <>
            <ProductDetails 
              productName="Cotton socks" 
              price="$10.90"
              discountPrice="$5.45"
              imageSrc="cotton-socks.png"
            />
            <ProductDetails 
              productName="Tennis balls" 
              price="$6.00"
              imageSrc="tennis-balls.png"
            />
            <ProductDetails 
              productName="Plain T-Shirt" 
              price="$7.99"
              imageSrc="plain-t-shirt.png"
            />
          </>
        );
      }

      const root = ReactDOM.createRoot(container);
      root.render(<App/>);
    </script>
  </body>
</html>
