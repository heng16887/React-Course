<!DOCTYPE html>
<html>
  <head>
    <title>Button ON and OFF</title>
    <style>
      .on-button{
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        padding: 10px 16px;
        cursor: pointer;
      }

      .off-button {
        background-color: rgb(220, 53, 69);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        padding: 10px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="01-react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js">
    </script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function App(){
        const [isButtonOn, setButtonOn] = React.useState(true);
        
        function handleButton(){
          setButtonOn(!isButtonOn);
        }

        return (
          <div>
            <button 
              className={
                isButtonOn ? 'on-button' : 'off-button'
              }
              onClick={handleButton}>
              {isButtonOn ? 'ON' : 'OFF'}
            </button>
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(
        <App />
      );
    </script>
  </body>
</html>
