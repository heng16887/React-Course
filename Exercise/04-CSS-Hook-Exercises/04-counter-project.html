<!DOCTYPE html>
<html>
  <head>
    <title>COUNTER PROJECT (4h-4i)</title>
    <style>
      body {
        margin-top: 0;
        margin-bottom: 0;
        font-family: Arial;
      }
      .button-count-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: rgb(222, 222, 222);
      }

      button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        margin-right: 5px;
        padding: 5px 10px;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function App(){
        const [count, setCount] = React.useState(0);
        const buttonElemRef = React.useRef(0);
        
        function increment(){
          setCount(c => c + 1);
        }

        function reset(){
          setCount(0);
        }

        function autoClickCounter(){
          setInterval(() => {
            const buttonElem = buttonElemRef.current;
            if(buttonElem){
              buttonElem.click();
            }
          }, 1000);
        }

        return (
          <div className='button-count-container'>
            <button 
              onClick={increment}
              ref={buttonElemRef}>
              Clicked {count} {count === 1 ? 'time' : 'times'}
            </button>
            <button onClick={reset}>
              Reset
            </button>
            <button 
              onClick={autoClickCounter}
              >
              Auto Click
            </button>
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(
        <App />
      );
    </script>
  </body>
</html>
